    [(ngModel)]="text"
    #meuTextareaFormControl="ngModel"
    minlength="5"
    required
></textarea>
Torna a sincronização automática, deixando o text logo no início e atualizado a cada envio -->

<textarea
    [ngModel]="text"
    (ngModelChange)="onChange($event)"
    #meuTextareaFormControl="ngModel"
    minlength="5"
    required
></textarea>

<br /> <br />

<p> Válido: {{ meuTextareaFormControl.valid }} </p>
<p> Tocado: {{ meuTextareaFormControl.touched }} </p>
<p> Sujo: {{ meuTextareaFormControl.dirty }} </p>

<br /> <br />

<button 
    (click)="showText()"
    [disabled]="meuTextareaFormControl.invalid"
> Mostrar texto atual </button>
